[project]
name = "pixl"
version = "0.1.0"
description = "A pixel-art generation model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets>=4.5.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pillow>=10.0",
    "torch>=2.8.0",
    "transformers>=4.57.6",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.9",
]
