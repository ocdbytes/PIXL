[project]
name = "pixl"
version = "0.1.0"
description = "A pixel-art generation model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets>=4.5.0",
    "huggingface-hub>=0.36.2",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pillow>=10.0",
    "safetensors>=0.7.0",
    "torch>=2.8.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Plain `uv sync` installs the tools and the notebook kernel; the Docker image skips both.
default-groups = ["dev", "notebook"]

[tool.basedpyright]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.17.3",
]
notebook = [
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.9.4",
    "pandas>=2.3.3",
]
